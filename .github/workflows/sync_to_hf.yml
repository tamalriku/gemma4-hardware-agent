name: Sync to HuggingFace Space

on:
  push:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions tab

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Full history needed for proper git push

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}    # Your HF username
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }} # e.g. gemma4-hardware-agent
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name  "GitHub Actions"

          # Add HuggingFace Space as a remote
          git remote add space \
            https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME

          # Push main branch → HF Space (force to handle HF's initial README commit)
          git push --force space main

          echo "✅ Successfully synced to https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME"
